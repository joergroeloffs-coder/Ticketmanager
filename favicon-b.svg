<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Ticketkasse">
  <!-- Zweiter Entwurf, andere Idee: nicht die Karte zeigen, sondern das,
       was diese Kasse tut — lesen. Das Suchmuster eines QR-Codes ist das
       Zeichen, das jeder Mensch inzwischen kennt, und es besteht aus vier
       großen Flächen. Deshalb hält es bis hinunter zu sechzehn Punkten,
       wo der erste Entwurf zum Fleck wird.

       Rechts die Perforation als Lochreihe: die Karte, nur angedeutet. -->

  <rect width="512" height="512" rx="104" fill="#1E5C3E"/>

  <!-- Suchmuster, groß und mittig auf der linken Seite -->
  <g>
    <rect x="86" y="130" width="252" height="252" rx="22" fill="#FAF8F1"/>
    <rect x="128" y="172" width="168" height="168" rx="10" fill="#1E5C3E"/>
    <rect x="166" y="210" width="92" height="92" rx="6" fill="#FAF8F1"/>
  </g>

  <!-- Perforation: die Trennlinie zwischen Karte und Abriss -->
  <g fill="#B08D3C">
    <circle cx="392" cy="152" r="17"/>
    <circle cx="392" cy="204" r="17"/>
    <circle cx="392" cy="256" r="17"/>
    <circle cx="392" cy="308" r="17"/>
    <circle cx="392" cy="360" r="17"/>
  </g>
</svg>
