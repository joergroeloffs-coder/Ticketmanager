<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Ticketkasse">
  <!-- Eine Eintrittskarte im Hausstil: Tannengrün als Grund, cremefarbenes
       Papier, die Goldkante des Vereinsmanagers als Rahmen, darauf das
       Suchmuster eines QR-Codes und rechts der Abriss.

       Die Kerben sitzen oben und unten auf der Perforation, nicht an den
       Seiten — so reißt eine Karte wirklich, und so sieht auch der Ausdruck
       aus. Alles grob gehalten: auf zweiunddreißig Punkten überlebt keine
       feine Linie. -->

  <rect width="512" height="512" rx="104" fill="#0C1D14"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none"
        stroke="#B08D3C" stroke-width="9"/>

  <!-- Karte mit Kerbe oben und unten, dort wo der Abriss sitzt -->
  <path fill="#FAF8F1" d="M76 146h250a30 30 0 0 0 60 0h50a16 16 0 0 1 16 16v188a16 16 0 0 1-16 16h-50a30 30 0 0 0-60 0H76a16 16 0 0 1-16-16V162a16 16 0 0 1 16-16z"/>

  <!-- Perforation zwischen Karte und Abriss -->
  <line x1="356" y1="176" x2="356" y2="336" stroke="#1E5C3E" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="24 20"/>

  <!-- Suchmuster eines QR-Codes -->
  <g fill="#1E5C3E">
    <path d="M100 186h104v104H100z"/>
    <path d="M118 204h68v68h-68z" fill="#FAF8F1"/>
    <path d="M136 222h32v32h-32z"/>
    <rect x="100" y="312" width="32" height="32"/>
    <rect x="146" y="312" width="32" height="32"/>
    <rect x="192" y="312" width="32" height="32"/>
  </g>

  <!-- Kategorie und Preis, als Balken angedeutet -->
  <g fill="#80621C">
    <rect x="240" y="196" width="90" height="26" rx="13"/>
    <rect x="240" y="244" width="62" height="22" rx="11"/>
  </g>
</svg>
